ServerRoot "."
Listen 127.0.0.1:18091
ServerName localhost
LoadModule authz_core_module C:/xampp/apache/modules/mod_authz_core.so
LoadModule authz_host_module C:/xampp/apache/modules/mod_authz_host.so
LoadModule dir_module C:/xampp/apache/modules/mod_dir.so
LoadModule mime_module C:/xampp/apache/modules/mod_mime.so
LoadModule env_module C:/xampp/apache/modules/mod_env.so
LoadFile "C:/xampp/php/php8ts.dll"
LoadFile "C:/xampp/php/libpq.dll"
LoadFile "C:/xampp/php/libsqlite3.dll"
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
PHPINIDir "C:/xampp/php"
TypesConfig "C:/xampp/apache/conf/mime.types"
PidFile "./scratch/qa-entrega/httpd.pid"
ErrorLog "./scratch/qa-entrega/apache-error.log"
DocumentRoot "./entrega-universidad"
<Directory "./entrega-universidad">
 AllowOverride All
 Require all granted
</Directory>
<FilesMatch "\.php$">
 SetHandler application/x-httpd-php
</FilesMatch>
SetEnv ABM_DB_PORT 13316
SetEnv ABM_DB_NAME aura_studio
SetEnv ABM_DB_HOST 127.0.0.1
SetEnv ABM_DB_USER root
